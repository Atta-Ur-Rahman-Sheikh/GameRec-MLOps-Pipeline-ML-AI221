name: Discord Push Notify

on:
  push:
    branches: [main, master, develop]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord message for push
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          webhook = os.environ.get("DISCORD_WEBHOOK_URL")
          if not webhook:
              raise ValueError("Missing DISCORD_WEBHOOK_URL secret")

          content = (
              "**🚀 Push detected**\n\n"
              f"📦 **Repo:** `{os.environ['REPO']}`\n"
              f"🌿 **Branch:** `{os.environ['BRANCH']}`\n"
              f"👤 **By:** `{os.environ['ACTOR']}`\n"
              f"🔖 **Commit:** `{os.environ['SHA'][:7]}`\n"
              f"💬 **Message:** {os.environ.get('COMMIT_MSG', '').strip() or '(no commit message)'}\n"
              f"🔗 **URL:** {os.environ.get('COMMIT_URL', '')}"
          )

          payload = json.dumps({
              "content": content
          }).encode("utf-8")

          req = urllib.request.Request(
              webhook,
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "GitHub-Actions-Webhook"
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  print("Discord notification sent:", response.status)
          except Exception as e:
              print("Error sending Discord notification:", e)
              raise
          PY