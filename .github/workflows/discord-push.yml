name: Discord Push Notify

on:
  push:
    branches: [main, master, develop]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord message for push
        env:
          DISCORD_WEBHOOK_URL: "https://discord.com/api/webhooks/1499826267464269996/FEwE6Zn2JLcaI3yqCtKFFLDyRfPlYEBmhyxi5ZeUNFXjRMbitT9QIQt9IUNbvJjzzn6U"
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          content = (
              "**Push detected**\n"
              f"Repo: `{os.environ['REPO']}`\n"
              f"Branch: `{os.environ['BRANCH']}`\n"
              f"By: `{os.environ['ACTOR']}`\n"
              f"Commit: `{os.environ['SHA'][:7]}`\n"
              f"Message: {os.environ.get('COMMIT_MSG', '').strip() or '(no commit message)'}\n"
              f"URL: {os.environ.get('COMMIT_URL', '')}"
          )

          payload = json.dumps({"content": content}).encode("utf-8")
          req = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK_URL"],
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=20):
              pass
          PY
